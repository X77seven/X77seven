<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Fetched and merged upstream">
  <defs>
    <g id="paw2">
      <ellipse cx="0" cy="12" rx="13" ry="11"/>
      <ellipse cx="-13" cy="-6" rx="7" ry="8.5" transform="rotate(-18 -13 -6)"/>
      <ellipse cx="-4.6" cy="-16" rx="7" ry="9"/>
      <ellipse cx="4.6" cy="-16" rx="7" ry="9"/>
      <ellipse cx="13" cy="-6" rx="7" ry="8.5" transform="rotate(18 13 -6)"/>
    </g>
    <g id="bone" fill="#F6C173" stroke="#1A1A1A" stroke-width="6">
      <rect x="-27" y="-7" width="54" height="14" rx="7"/>
      <circle cx="-29" cy="-8.5" r="9.5"/>
      <circle cx="-29" cy="8.5" r="9.5"/>
      <circle cx="29" cy="-8.5" r="9.5"/>
      <circle cx="29" cy="8.5" r="9.5"/>
    </g>
    <style>
      .hop { animation: hop 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      .w1 { animation: wig 3.2s ease-in-out infinite; }
      .w2 { animation: wig 3.2s ease-in-out .45s infinite; }
      .w3 { animation: wig 3.2s ease-in-out .9s infinite; }
      @keyframes wig { 0%, 100% { opacity: .18; } 50% { opacity: .7; } }
    </style>
  </defs>

  <rect width="880" height="240" rx="16" fill="#FFFBF3"/>

  <!-- paw trail -->
  <g fill="#F6C173" stroke="#1A1A1A" stroke-width="6">
    <use href="#paw2" transform="translate(34,80) rotate(-28) scale(0.5)" class="w1"/>
    <use href="#paw2" transform="translate(64,56) rotate(-16) scale(0.5)" class="w2"/>
    <use href="#paw2" transform="translate(96,40) rotate(-6) scale(0.5)" class="w3"/>
  </g>

  <!-- title -->
  <g class="hop">
    <use href="#paw2" transform="translate(158,46) scale(0.66)" fill="#F6C173" stroke="#1A1A1A" stroke-width="6"/>
  </g>
  <text x="188" y="56" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="900" fill="#1A1A1A">
    Fetched &amp; merged
  </text>
  <g>
    <use href="#bone" transform="translate(560,45) scale(0.8)"/>
    <text x="598" y="53" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#1A1A1A">
      2 / 2 — Pull Shark unlocked
    </text>
  </g>

  <!-- card 1 -->
  <rect x="24" y="82" width="412" height="104" rx="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
  <use href="#paw2" transform="translate(58,134) scale(0.5)" fill="#F6C173" stroke="#1A1A1A" stroke-width="7"/>
  <text x="78" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1A1A1A">
    bytedance/deer-flow
  </text>
  <text x="78" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A4A4A">
    dev deploy now fails fast when DEER_FLOW_HOME
  </text>
  <text x="78" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A4A4A">
    is not writable — instead of dying mid-run
  </text>
  <text x="418" y="122" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#EE9B3A">
    ★ 83,581
  </text>

  <!-- card 2 -->
  <rect x="444" y="82" width="412" height="104" rx="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
  <use href="#paw2" transform="translate(478,134) scale(0.5)" fill="#F6C173" stroke="#1A1A1A" stroke-width="7"/>
  <text x="498" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#1A1A1A">
    iflytek/skillhub
  </text>
  <text x="498" y="146" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A4A4A">
    MinIO runtime image repointed to a registry
  </text>
  <text x="498" y="166" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#4A4A4A">
    that still resolves — docker compose up works
  </text>
  <text x="838" y="122" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#EE9B3A">
    ★ 5,166
  </text>

  <text x="440" y="220" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4A4A4A">
    fetch · review · merge · repeat — golden behaviour
  </text>
</svg>
