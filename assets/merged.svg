<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Fetched and merged upstream">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F0"/>
      <stop offset="1" stop-color="#FFE9CF"/>
    </linearGradient>
    <g id="paw2">
      <ellipse cx="0" cy="10" rx="13" ry="11"/>
      <ellipse cx="-13" cy="-6" rx="6.4" ry="8" transform="rotate(-18 -13 -6)"/>
      <ellipse cx="-4.6" cy="-15" rx="6.4" ry="8.6"/>
      <ellipse cx="4.6" cy="-15" rx="6.4" ry="8.6"/>
      <ellipse cx="13" cy="-6" rx="6.4" ry="8" transform="rotate(18 13 -6)"/>
    </g>
    <g id="bone">
      <rect x="-26" y="-6" width="52" height="12" rx="6"/>
      <circle cx="-28" cy="-8" r="9"/>
      <circle cx="-28" cy="8" r="9"/>
      <circle cx="28" cy="-8" r="9"/>
      <circle cx="28" cy="8" r="9"/>
    </g>
    <style>
      .hop { animation: hop 2.2s ease-in-out infinite; }
      @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      .fade1 { animation: fade 3.2s ease-in-out infinite; }
      .fade2 { animation: fade 3.2s ease-in-out 0.5s infinite; }
      .fade3 { animation: fade 3.2s ease-in-out 1s infinite; }
      @keyframes fade { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="880" height="240" rx="16" fill="url(#mBg)"/>

  <!-- paw trail -->
  <g fill="#D9A055" opacity="0.28">
    <use href="#paw2" transform="translate(30,74) rotate(-28) scale(0.5)" class="fade1"/>
    <use href="#paw2" transform="translate(58,52) rotate(-16) scale(0.5)" class="fade2"/>
    <use href="#paw2" transform="translate(88,38) rotate(-6) scale(0.5)" class="fade3"/>
  </g>

  <!-- title -->
  <g class="hop">
    <use href="#paw2" transform="translate(150,44) scale(0.62)" fill="#D98A2B"/>
  </g>
  <text x="176" y="54" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#4A3728">
    Fetched &amp; merged
  </text>
  <g>
    <use href="#bone" transform="translate(560,44) scale(0.85)" fill="#F6C445"/>
    <text x="596" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#B07C3A">
      2 / 2 — Pull Shark unlocked
    </text>
  </g>

  <!-- card 1 -->
  <rect x="24" y="82" width="412" height="104" rx="12" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="1.5"/>
  <use href="#paw2" transform="translate(56,134) scale(0.5)" fill="#D9A055"/>
  <text x="76" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#4A3728">
    bytedance/deer-flow
  </text>
  <text x="76" y="146" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#7A6350">
    dev deploy now fails fast when DEER_FLOW_HOME
  </text>
  <text x="76" y="166" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#7A6350">
    is not writable — instead of dying mid-run
  </text>
  <text x="418" y="122" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B07C3A">
    ★ 83,581
  </text>

  <!-- card 2 -->
  <rect x="444" y="82" width="412" height="104" rx="12" fill="#FFFFFF" stroke="#F0DCC0" stroke-width="1.5"/>
  <use href="#paw2" transform="translate(476,134) scale(0.5)" fill="#D9A055"/>
  <text x="496" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#4A3728">
    iflytek/skillhub
  </text>
  <text x="496" y="146" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#7A6350">
    MinIO runtime image repointed to a registry
  </text>
  <text x="496" y="166" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#7A6350">
    that still resolves — docker compose up works
  </text>
  <text x="838" y="122" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#B07C3A">
    ★ 5,166
  </text>

  <text x="440" y="220" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#B08A5E">
    fetch · review · merge · repeat — golden behaviour
  </text>
</svg>
