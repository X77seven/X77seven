<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="X77 — doodle golden retriever banner">
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="12" rx="13" ry="11"/>
      <ellipse cx="-13" cy="-6" rx="7" ry="8.5" transform="rotate(-18 -13 -6)"/>
      <ellipse cx="-4.6" cy="-16" rx="7" ry="9"/>
      <ellipse cx="4.6" cy="-16" rx="7" ry="9"/>
      <ellipse cx="13" cy="-6" rx="7" ry="8.5" transform="rotate(18 13 -6)"/>
    </g>

    <style>
      .blink { animation: blink 4.8s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }

      .tongue { animation: pant 1.2s ease-in-out infinite; }
      @keyframes pant { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

      .earL { animation: earl 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 14%; }
      .earR { animation: earr 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 14%; }
      @keyframes earl { 0%, 100% { transform: rotate(0deg); } 45% { transform: rotate(-5deg); } 70% { transform: rotate(2deg); } }
      @keyframes earr { 0%, 100% { transform: rotate(0deg); } 45% { transform: rotate(5deg); } 70% { transform: rotate(-2deg); } }

      .tail { animation: wag 0.95s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
      @keyframes wag { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }

      .buoy { animation: float 3.4s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="880" height="420" rx="18" fill="#FFFBF3"/>

  <g opacity="0.13" fill="#F6C173" stroke="#1A1A1A" stroke-width="6">
    <use href="#paw" transform="translate(62,34) rotate(16) scale(0.7)"/>
    <use href="#paw" transform="translate(840,394) rotate(-14) scale(0.9)"/>
  </g>

  <!-- ===== doodle dog ===== -->
  <g transform="translate(194,292) scale(0.80) translate(-210,-296)">

    <!-- tail -->
    <g class="tail">
      <path d="M314 330 C 352 326 368 300 356 274" stroke="#1A1A1A" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M314 330 C 352 326 368 300 356 274" stroke="#F6C173" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- body -->
    <ellipse cx="210" cy="300" rx="112" ry="96" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="148" cy="368" rx="58" ry="36" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
    <ellipse cx="272" cy="368" rx="58" ry="36" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
    <g stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M180 330 L 176 400"/>
      <path d="M224 330 L 228 400"/>
    </g>

    <!-- ears, up on the sides -->
    <g transform="rotate(-12 88 136)"><g class="earL">
      <ellipse cx="88" cy="136" rx="30" ry="48" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
    </g></g>
    <g transform="rotate(12 332 136)"><g class="earR">
      <ellipse cx="332" cy="136" rx="30" ry="48" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
    </g></g>

    <!-- head -->
    <rect x="80" y="76" width="260" height="224" rx="98" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>

    <!-- head tufts -->
    <g stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M176 80 C 170 62 180 54 184 64"/>
      <path d="M210 72 C 208 54 220 52 220 62"/>
      <path d="M244 80 C 250 64 260 62 258 72"/>
    </g>

    <!-- eyes -->
    <g class="blink">
      <circle cx="162" cy="172" r="13" fill="#1A1A1A"/>
      <circle cx="258" cy="172" r="13" fill="#1A1A1A"/>
    </g>

    <!-- muzzle block -->
    <rect x="122" y="200" width="176" height="90" rx="45" fill="#1A1A1A"/>

    <!-- tongue -->
    <g transform="rotate(7 270 322)"><g class="tongue">
      <rect x="244" y="288" width="52" height="72" rx="26" fill="#F5828C" stroke="#1A1A1A" stroke-width="12"/>
      <path d="M270 302 L 271 340" stroke="#E3697A" stroke-width="6" stroke-linecap="round"/>
    </g></g>

    <!-- neck dashes -->
    <g stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M134 266 L 120 270"/>
      <path d="M130 286 L 116 291"/>
      <path d="M136 306 L 122 313"/>
    </g>
  </g>

  <!-- speech bubble, well clear of the ears -->
  <g class="buoy">
    <path d="M389 96 L 365 126 L 399 110 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="11" stroke-linejoin="round"/>
    <rect x="371" y="26" width="58" height="72" rx="29" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="11"/>
    <path d="M400 46 L 400 66" stroke="#1A1A1A" stroke-width="12" stroke-linecap="round"/>
    <circle cx="400" cy="84" r="6.5" fill="#1A1A1A"/>
  </g>

  <!-- ===== text ===== -->
  <rect x="480" y="64" width="248" height="34" rx="17" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
  <circle cx="501" cy="81" r="6.5" fill="#EE9B3A" class="pulse"/>
  <text x="518" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1A1A1A">[ OK ]  good boy online</text>

  <text x="478" y="190" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-3">
    <tspan fill="#1A1A1A">X</tspan><tspan fill="#EE9B3A">77</tspan>
  </text>

  <text x="482" y="226" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18.5" font-weight="700" fill="#1A1A1A">
    I fetch bugs and bring them back.
  </text>

  <path d="M482 252 L 834 252" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <text x="482" y="288"><tspan fill="#C97A2B" font-weight="700">$ whoami</tspan><tspan fill="#4A4A4A">  →  X77 · Xiamen, China</tspan></text>
    <text x="482" y="318"><tspan fill="#C97A2B" font-weight="700">$ cat stack.txt</tspan><tspan fill="#4A4A4A">  →  Python · TypeScript · Java</tspan></text>
    <text x="482" y="348"><tspan fill="#C97A2B" font-weight="700">$ git log --merged</tspan><tspan fill="#4A4A4A">  →  2 PRs merged upstream</tspan></text>
  </g>

  <g transform="translate(496,378) rotate(-12) scale(0.44)" fill="#F6C173" stroke="#1A1A1A" stroke-width="10">
    <use href="#paw"/>
  </g>
  <text x="518" y="384" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A">
    Pull Shark — 2 of 2 fetched
  </text>
</svg>
