<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="X77 — doodle golden retriever banner">
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="12" rx="13" ry="11"/>
      <ellipse cx="-13" cy="-6" rx="7" ry="8.5" transform="rotate(-18 -13 -6)"/>
      <ellipse cx="-4.6" cy="-16" rx="7" ry="9"/>
      <ellipse cx="4.6" cy="-16" rx="7" ry="9"/>
      <ellipse cx="13" cy="-6" rx="7" ry="8.5" transform="rotate(18 13 -6)"/>
    </g>

    <style>
      .blink { animation: blink 4.8s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.08); } }

      .tongue { animation: pant 1.2s ease-in-out infinite; }
      @keyframes pant { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

      .earL { animation: earl 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 12%; }
      .earR { animation: earr 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 12%; }
      @keyframes earl { 0%, 100% { transform: rotate(0deg); } 45% { transform: rotate(-5deg); } 70% { transform: rotate(2deg); } }
      @keyframes earr { 0%, 100% { transform: rotate(0deg); } 45% { transform: rotate(5deg); } 70% { transform: rotate(-2deg); } }

      .tail { animation: wag 0.95s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
      @keyframes wag { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }

      .buoy { animation: float 3.4s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }

      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="880" height="420" rx="18" fill="#FFFBF3"/>

  <g opacity="0.13" fill="#F6C173" stroke="#1A1A1A" stroke-width="6">
    <use href="#paw" transform="translate(788,72) rotate(15) scale(1.2)"/>
    <use href="#paw" transform="translate(824,348) rotate(-12) scale(0.95)"/>
    <use href="#paw" transform="translate(452,392) rotate(10) scale(0.8)"/>
  </g>

  <!-- ===== doodle dog ===== -->
  <!-- tail -->
  <g class="tail">
    <path d="M316 332 C 356 328 374 300 362 272" stroke="#1A1A1A" stroke-width="15" fill="none" stroke-linecap="round"/>
    <path d="M316 332 C 356 328 374 300 362 272" stroke="#F6C173" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- body -->
  <ellipse cx="210" cy="296" rx="118" ry="100" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
  <!-- feet -->
  <ellipse cx="142" cy="366" rx="62" ry="38" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
  <ellipse cx="278" cy="366" rx="62" ry="38" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
  <!-- front legs -->
  <g stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M186 318 L 182 400"/>
    <path d="M236 318 L 240 400"/>
  </g>

  <!-- ears (small, drooping) -->
  <g transform="rotate(-14 80 150)"><g class="earL">
    <ellipse cx="80" cy="150" rx="28" ry="44" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
  </g></g>
  <g transform="rotate(14 340 150)"><g class="earR">
    <ellipse cx="340" cy="150" rx="28" ry="44" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>
  </g></g>

  <!-- head -->
  <rect x="74" y="70" width="272" height="236" rx="102" fill="#F6C173" stroke="#1A1A1A" stroke-width="14"/>

  <!-- head tufts -->
  <g stroke="#1A1A1A" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M172 74 C 166 56 176 48 180 58"/>
    <path d="M212 66 C 210 48 222 46 222 56"/>
    <path d="M252 74 C 258 58 268 56 266 66"/>
  </g>

  <!-- eyes -->
  <g class="blink">
    <circle cx="166" cy="176" r="13" fill="#1A1A1A"/>
    <circle cx="254" cy="176" r="13" fill="#1A1A1A"/>
  </g>

  <!-- muzzle block -->
  <rect x="112" y="202" width="200" height="114" rx="56" fill="#1A1A1A"/>

  <!-- tongue -->
  <g transform="rotate(7 256 337)"><g class="tongue">
    <rect x="228" y="298" width="56" height="78" rx="28" fill="#F5828C" stroke="#1A1A1A" stroke-width="12"/>
    <path d="M258 314 L 259 356" stroke="#E3697A" stroke-width="6" stroke-linecap="round"/>
  </g></g>

  <!-- neck dashes -->
  <g stroke="#1A1A1A" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M128 262 L 114 266"/>
    <path d="M124 284 L 110 289"/>
    <path d="M130 306 L 116 313"/>
  </g>

  <!-- speech bubble -->
  <g class="buoy">
    <path d="M404 128 L 374 156 L 420 142 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="11" stroke-linejoin="round"/>
    <rect x="374" y="44" width="68" height="84" rx="34" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="11"/>
    <path d="M408 66 L 408 92" stroke="#1A1A1A" stroke-width="14" stroke-linecap="round"/>
    <circle cx="408" cy="112" r="7.5" fill="#1A1A1A"/>
  </g>

  <!-- ===== text ===== -->
  <rect x="470" y="70" width="248" height="34" rx="17" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3.5"/>
  <circle cx="491" cy="87" r="6.5" fill="#EE9B3A" class="pulse"/>
  <text x="508" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#1A1A1A">[ OK ]  good boy online</text>

  <text x="468" y="188" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="94" font-weight="900" letter-spacing="-3">
    <tspan fill="#1A1A1A">X</tspan><tspan fill="#EE9B3A">77</tspan>
  </text>

  <text x="472" y="222" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1A1A1A">
    I fetch bugs and bring them back.
  </text>

  <path d="M472 244 L 828 244" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <text x="472" y="274"><tspan fill="#C97A2B" font-weight="700">$ whoami</tspan><tspan fill="#4A4A4A">  →  X77 · Xiamen, China</tspan></text>
    <text x="472" y="300"><tspan fill="#C97A2B" font-weight="700">$ cat stack.txt</tspan><tspan fill="#4A4A4A">  →  Python · TypeScript · Java</tspan></text>
    <text x="472" y="326"><tspan fill="#C97A2B" font-weight="700">$ git log --merged</tspan><tspan fill="#4A4A4A">  →  2 PRs merged upstream</tspan></text>
  </g>

  <g transform="translate(487,360) rotate(-12) scale(0.44)" fill="#F6C173" stroke="#1A1A1A" stroke-width="10">
    <use href="#paw"/>
  </g>
  <text x="510" y="366" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1A1A1A">
    Pull Shark — 2 of 2 fetched
  </text>
</svg>
