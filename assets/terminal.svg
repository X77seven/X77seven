<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="X77 — golden retriever banner">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFAF2"/>
      <stop offset="0.5" stop-color="#FFF2DE"/>
      <stop offset="1" stop-color="#FFE6C4"/>
    </linearGradient>
    <linearGradient id="headG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FCE6BE"/>
      <stop offset="1" stop-color="#EDBB78"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8DDAE"/>
      <stop offset="1" stop-color="#E3AC5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <g id="paw">
      <ellipse cx="0" cy="10" rx="13" ry="11"/>
      <ellipse cx="-13" cy="-6" rx="6.4" ry="8" transform="rotate(-18 -13 -6)"/>
      <ellipse cx="-4.6" cy="-15" rx="6.4" ry="8.6"/>
      <ellipse cx="4.6" cy="-15" rx="6.4" ry="8.6"/>
      <ellipse cx="13" cy="-6" rx="6.4" ry="8" transform="rotate(18 13 -6)"/>
    </g>

    <style>
      .blink { animation: blink 4.6s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(0.08); } }

      .tail { animation: wag 1.15s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
      @keyframes wag { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(9deg); } }

      .earL { animation: earl 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 38% 100%; }
      .earR { animation: earr 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 62% 100%; }
      @keyframes earl { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(-6deg); } 70% { transform: rotate(3deg); } }
      @keyframes earr { 0%, 100% { transform: rotate(0deg); } 40% { transform: rotate(6deg); } 70% { transform: rotate(-3deg); } }

      .tongue { animation: pant 1.3s ease-in-out infinite; }
      @keyframes pant { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3.5px); } }

      .tag { animation: swing 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
      @keyframes swing { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }

      .ball { animation: bounce 1.6s cubic-bezier(.5,.05,.5,.95) infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes bounce { 0%, 100% { transform: translateY(0) scaleY(1); } 45% { transform: translateY(-26px) scaleY(1); } 50% { transform: translateY(-18px) scaleY(0.86); } 55% { transform: translateY(0) scaleY(1.1); } 60% { transform: translateY(0) scaleY(1); } }

      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="880" height="420" rx="18" fill="url(#bgG)"/>
  <ellipse cx="250" cy="200" rx="300" ry="200" fill="url(#glow)"/>

  <g fill="#E3B771" opacity="0.18">
    <use href="#paw" transform="translate(66,58) rotate(-24) scale(1.15)"/>
    <use href="#paw" transform="translate(700,52) rotate(20) scale(1.25)"/>
    <use href="#paw" transform="translate(818,360) rotate(-14) scale(0.95)"/>
    <use href="#paw" transform="translate(470,392) rotate(12) scale(0.8)"/>
  </g>

  <!-- ===== golden retriever ===== -->
  <!-- feathered tail -->
  <g class="tail">
    <path d="M318 300 C 372 300 404 262 398 222" stroke="#E3AC5E" stroke-width="30" stroke-linecap="round" fill="none"/>
    <path d="M386 236 C 404 228 412 210 404 196" stroke="#FCE6BE" stroke-width="16" stroke-linecap="round" fill="none"/>
    <g stroke="#FFF6E6" stroke-width="7" stroke-linecap="round">
      <path d="M392 214 L408 206"/>
      <path d="M392 232 L410 232"/>
      <path d="M386 250 L402 258"/>
    </g>
  </g>

  <!-- body + chest ruff -->
  <ellipse cx="232" cy="302" rx="94" ry="66" fill="url(#bodyG)"/>
  <ellipse cx="232" cy="288" rx="78" ry="44" fill="#FFF4E2"/>
  <ellipse cx="232" cy="322" rx="58" ry="42" fill="#FFF8EC"/>

  <!-- head -->
  <circle cx="232" cy="186" r="82" fill="url(#headG)"/>

  <!-- erect ears -->
  <g class="earL">
    <path d="M174 148 C 144 112 136 72 152 50 C 174 68 214 96 238 110 Z" fill="#D9A055"/>
    <path d="M182 142 C 160 112 152 82 160 64 C 178 82 206 104 226 114 Z" fill="#C88F42"/>
  </g>
  <g class="earR">
    <path d="M290 148 C 320 112 328 72 312 50 C 290 68 250 96 226 110 Z" fill="#D9A055"/>
    <path d="M282 142 C 304 112 312 82 304 64 C 286 82 258 104 238 114 Z" fill="#C88F42"/>
  </g>

  <!-- muzzle -->
  <ellipse cx="232" cy="224" rx="56" ry="34" fill="#FFF6E9"/>
  <ellipse cx="174" cy="208" rx="17" ry="10" fill="#FF9E8F" opacity="0.28"/>
  <ellipse cx="290" cy="208" rx="17" ry="10" fill="#FF9E8F" opacity="0.28"/>

  <!-- eyes -->
  <g class="blink">
    <circle cx="206" cy="178" r="10.5" fill="#3A2A1E"/>
    <circle cx="258" cy="178" r="10.5" fill="#3A2A1E"/>
    <circle cx="209.5" cy="174" r="3.6" fill="#FFFFFF"/>
    <circle cx="261.5" cy="174" r="3.6" fill="#FFFFFF"/>
  </g>
  <g stroke="#D9A055" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M195 158 Q 206 152 217 157"/>
    <path d="M247 157 Q 258 152 269 158"/>
  </g>

  <!-- snout -->
  <ellipse cx="232" cy="212" rx="15" ry="11" fill="#3A2A1E"/>
  <path d="M232 223 Q 218 240 203 231" stroke="#3A2A1E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M232 223 Q 246 240 261 231" stroke="#3A2A1E" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g class="tongue">
    <ellipse cx="232" cy="240" rx="13" ry="10" fill="#FF8FA3"/>
    <path d="M232 234 L232 244" stroke="#E86A80" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- collar + tag -->
  <path d="M162 268 Q 232 304 302 268" stroke="#C0452A" stroke-width="15" fill="none" stroke-linecap="round"/>
  <g class="tag">
    <path d="M232 292 L232 300" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>
    <circle cx="232" cy="310" r="15" fill="#F6C445" stroke="#D9A521" stroke-width="2"/>
    <text x="232" y="314" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#5A3E12">X77</text>
  </g>

  <!-- paws -->
  <ellipse cx="180" cy="352" rx="30" ry="18" fill="#FFF4E2"/>
  <ellipse cx="284" cy="352" rx="30" ry="18" fill="#FFF4E2"/>
  <g stroke="#EFD8B4" stroke-width="2.5" stroke-linecap="round">
    <path d="M170 346 L170 356"/><path d="M180 344 L180 356"/><path d="M190 346 L190 356"/>
    <path d="M274 346 L274 356"/><path d="M284 344 L284 356"/><path d="M294 346 L294 356"/>
  </g>

  <!-- ball -->
  <g class="ball">
    <circle cx="372" cy="368" r="20" fill="#C0452A"/>
    <path d="M356 360 Q 372 372 388 360" stroke="#FFF6E6" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M358 378 Q 372 366 386 378" stroke="#FFF6E6" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== text ===== -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="470" y="76" width="232" height="30" rx="15" fill="#7A5A18" opacity="0.10"/>
    <text x="486" y="96" font-size="14" font-weight="700" fill="#8A6516">[ OK ]  good boy online</text>
  </g>

  <text x="470" y="182" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">
    <tspan fill="#4A3728">X</tspan><tspan fill="#D98A2B">77</tspan>
  </text>

  <text x="472" y="214" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="19" fill="#7A6350">
    I fetch bugs and bring them back.
  </text>

  <path d="M472 236 L836 236" stroke="#EFD8B4" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <text x="472" y="266"><tspan fill="#C08548">$ whoami</tspan><tspan fill="#6B5540">  →  X77 · Xiamen, China</tspan></text>
    <text x="472" y="292"><tspan fill="#C08548">$ cat stack.txt</tspan><tspan fill="#6B5540">  →  Python · TypeScript · Java</tspan></text>
    <text x="472" y="318"><tspan fill="#C08548">$ git log --merged</tspan><tspan fill="#6B5540">  →  2 PRs merged upstream</tspan></text>
  </g>

  <g>
    <use href="#paw" transform="translate(484,352) rotate(-12) scale(0.42)" fill="#D9A96B"/>
    <text x="502" y="358" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#B07C3A">
      Pull Shark — 2 of 2 fetched
    </text>
  </g>

  <circle cx="836" cy="96" r="5" fill="#8A6516" class="pulse"/>
</svg>
